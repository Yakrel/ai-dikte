name: Build Windows Executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run runtime contract tests
        run: python -m unittest discover -s tests -v

      - name: Validate Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\install.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Source runtime self-test
        run: python ai_dikte.py --self-test

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "ai-dikte-windows" `
            --icon "ai-dikte.ico" `
            --add-data "ai-dikte;." `
            --add-data "ai-dikte.png;." `
            --collect-submodules websockets `
            --collect-data _sounddevice_data `
            --hidden-import pystray._win32 `
            --clean `
            ai_dikte.py

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\dist\ai-dikte-windows.exe" -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "Frozen executable version test failed with exit code $($proc.ExitCode)"
          }

          $proc = Start-Process -FilePath ".\dist\ai-dikte-windows.exe" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "Frozen executable runtime self-test failed with exit code $($proc.ExitCode)"
          }
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ".\dist\ai-dikte-windows.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ai-dikte-windows.exe" | Set-Content `
            -Path ".\dist\ai-dikte-windows.exe.sha256" `
            -Encoding ascii `
            -NoNewline

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-dikte-windows
          path: |
            dist/ai-dikte-windows.exe
            dist/ai-dikte-windows.exe.sha256
          if-no-files-found: error
          retention-days: 7

  release-windows:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-dikte-windows
          path: dist

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tag="latest"
            git tag -f "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag" --force

            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" \
                dist/ai-dikte-windows.exe \
                dist/ai-dikte-windows.exe.sha256 \
                --clobber
              gh release edit "$tag" \
                --title "Latest Windows Build" \
                --notes "Automatically built and runtime-tested from commit $GITHUB_SHA." \
                --latest
            else
              gh release create "$tag" \
                dist/ai-dikte-windows.exe \
                dist/ai-dikte-windows.exe.sha256 \
                --title "Latest Windows Build" \
                --notes "Automatically built and runtime-tested from commit $GITHUB_SHA." \
                --latest
            fi
          else
            tag="$GITHUB_REF_NAME"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" \
                dist/ai-dikte-windows.exe \
                dist/ai-dikte-windows.exe.sha256 \
                --clobber
            else
              gh release create "$tag" \
                dist/ai-dikte-windows.exe \
                dist/ai-dikte-windows.exe.sha256 \
                --title "AI Dikte $tag" \
                --generate-notes
            fi
          fi
