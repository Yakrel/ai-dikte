name: Build Windows Executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone Windows executable
        run: |
          pyinstaller --onefile --noconsole --name "ai-dikte-windows" --add-data "ai-dikte;." ai_dikte.py

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\ai-dikte-windows.exe" -ArgumentList "--version" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Frozen executable smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-dikte-windows-exe
          path: dist/ai-dikte-windows.exe
          if-no-files-found: error

  release-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-dikte-windows-exe
          path: dist

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ai-dikte-windows.exe
