name: Build Windows Executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Test Rust application
        run: cargo +1.98.1 test --locked --manifest-path rust/Cargo.toml
      - name: Validate Windows installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\install.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Test installer failure paths
        shell: pwsh
        run: ./tests/test_installer.ps1

      - name: Build standalone Rust Windows executable
        shell: pwsh
        run: |
          cargo +1.98.1 build --locked --release --features windows-host --manifest-path rust/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Rust build failed" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item rust/target/release/ai-dikte.exe dist/ai-dikte-windows.exe
          Copy-Item rust/target/release/ai-dikte-background.exe dist/ai-dikte-background.exe

      - name: Smoke test Rust executable
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\dist\ai-dikte-windows.exe" -ArgumentList "--version" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "Rust executable version test failed with exit code $($proc.ExitCode)"
          }

          $proc = Start-Process -FilePath ".\dist\ai-dikte-windows.exe" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            throw "Rust executable runtime self-test failed with exit code $($proc.ExitCode)"
          }
      - name: Verify console and background subsystem separation
        shell: pwsh
        run: |
          foreach ($entry in @(@{Name='ai-dikte-windows.exe'; Subsystem=3}, @{Name='ai-dikte-background.exe'; Subsystem=2})) {
            $bytes = [IO.File]::ReadAllBytes((Resolve-Path "./dist/$($entry.Name)"))
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
            if ($subsystem -ne $entry.Subsystem) { throw "Wrong Windows subsystem: $($entry.Name)" }
          }
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          foreach ($name in @('ai-dikte-windows.exe', 'ai-dikte-background.exe')) {
            $hash = (Get-FileHash "./dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -Path "./dist/$name.sha256" -Encoding ascii -NoNewline
          }
          $hostProc = Start-Process -FilePath './dist/ai-dikte-background.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($hostProc.ExitCode -ne 0) { throw 'Background host self-test failed' }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-dikte-windows
          path: |
            dist/ai-dikte-windows.exe
            dist/ai-dikte-windows.exe.sha256
            dist/ai-dikte-background.exe
            dist/ai-dikte-background.exe.sha256
          if-no-files-found: error
          retention-days: 7

  release-windows:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-dikte-windows
          path: dist

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tag="latest"
            git tag -f "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag" --force

            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" \
                dist/ai-dikte-windows.exe \
                dist/ai-dikte-windows.exe.sha256 \
                dist/ai-dikte-background.exe \
                dist/ai-dikte-background.exe.sha256 \
                --clobber
              gh release edit "$tag" \
                --title "Latest Windows Build" \
                --notes "Automatically built and runtime-tested from commit $GITHUB_SHA." \
                --latest
            else
              gh release create "$tag" \
                dist/ai-dikte-windows.exe \
                dist/ai-dikte-windows.exe.sha256 \
                dist/ai-dikte-background.exe \
                dist/ai-dikte-background.exe.sha256 \
                --title "Latest Windows Build" \
                --notes "Automatically built and runtime-tested from commit $GITHUB_SHA." \
                --latest
            fi
          else
            tag="$GITHUB_REF_NAME"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" \
                dist/ai-dikte-windows.exe \
                dist/ai-dikte-windows.exe.sha256 \
                dist/ai-dikte-background.exe \
                dist/ai-dikte-background.exe.sha256 \
                --clobber
            else
              gh release create "$tag" \
                dist/ai-dikte-windows.exe \
                dist/ai-dikte-windows.exe.sha256 \
                dist/ai-dikte-background.exe \
                dist/ai-dikte-background.exe.sha256 \
                --title "AI Dikte $tag" \
                --generate-notes
            fi
          fi
