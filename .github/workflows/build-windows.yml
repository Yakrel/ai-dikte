name: Build Windows Executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Standalone Windows Executable with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name "ai-dikte-windows" --add-data "ai-dikte;." ai_dikte.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-dikte-windows-exe
          path: dist/ai-dikte-windows.exe
          if-no-files-found: error

      - name: Release Asset (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ai-dikte-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
