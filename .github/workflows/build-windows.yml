name: Build Windows Executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Source runtime self-test
        run: python ai_dikte.py --self-test

      - name: Build standalone Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --console `
            --name "ai-dikte-windows" `
            --add-data "ai-dikte;." `
            --collect-submodules websockets `
            --collect-data _sounddevice_data `
            --hidden-import pystray._win32 `
            --hidden-import keyboard._winkeyboard `
            --clean `
            ai_dikte.py

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          & ".\dist\ai-dikte-windows.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "Frozen executable version test failed with exit code $LASTEXITCODE"
          }

          & ".\dist\ai-dikte-windows.exe" --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Frozen executable runtime self-test failed with exit code $LASTEXITCODE"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-dikte-windows
          path: dist/ai-dikte-windows.exe
          if-no-files-found: error
          retention-days: 7

  release-windows:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-dikte-windows
          path: dist

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tag="latest"

            if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" >/dev/null 2>&1; then
              release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" >/dev/null 2>&1 || true

            gh release create "$tag" dist/ai-dikte-windows.exe \
              --target "$GITHUB_SHA" \
              --title "Latest Windows Build" \
              --notes "Automatically built and runtime-tested from the latest main branch commit ($GITHUB_SHA)."
          else
            tag="$GITHUB_REF_NAME"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/ai-dikte-windows.exe --clobber
            else
              gh release create "$tag" dist/ai-dikte-windows.exe \
                --title "AI Dikte $tag" \
                --generate-notes
            fi
          fi
