name: PR final core cleanup

on:
  push:
    branches:
      - fix/simplify-settings-and-transcripts

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/simplify-settings-and-transcripts
          fetch-depth: 0

      - name: Apply cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          core_path = Path("ai_dikte_core.py")
          core = core_path.read_text(encoding="utf-8")
          core = core.replace("import queue\n", "", 1)
          core = core.replace("def fail(message: str, code: int = 1) -> None:\n", "def fail(message: str) -> None:\n", 1)
          core = core.replace(
              "def available_output_driver(_config: dict[str, Any] | None = None) -> str | None:\n",
              "def available_output_driver() -> str | None:\n",
              1,
          )
          core = core.replace("        driver = available_output_driver(config)\n", "        driver = available_output_driver()\n", 1)
          core = core.replace(
              '''        elif command == "setup":\n            setup()\n''',
              '',
              1,
          )

          start = core.index("def doctor() -> None:\n")
          end = core.index("\n\ndef main() -> None:\n", start)
          doctor = '''def doctor() -> None:\n    config = load_config(required=False)\n    desktop = desktop_kind()\n    driver_error = None\n    try:\n        driver = available_output_driver()\n    except RuntimeError as exc:\n        driver = None\n        driver_error = str(exc)\n\n    if IS_WINDOWS:\n        checks = {\n            "platform-windows": True,\n            "sounddevice": sounddevice is not None,\n            "microphone": microphone_available(config),\n            "python-websockets": websockets is not None,\n            "direct-typing (SendInput)": bool(driver),\n            "config": CONFIG_FILE.exists(),\n            "api-key (Credential Manager)": bool(load_api_key(required=False)),\n        }\n    else:\n        checks = {\n            "supported-desktop": desktop in {"kde", "hyprland"},\n            "wayland": bool(os.environ.get("WAYLAND_DISPLAY")),\n            "pw-record": bool(shutil.which("pw-record")),\n            "notify-send": bool(shutil.which("notify-send")),\n            "python-websockets": websockets is not None,\n            "config": CONFIG_FILE.exists(),\n            "api-key": bool(str(config.get("api_key", "")).strip()),\n            "direct-typing": bool(driver),\n        }\n        if desktop == "hyprland":\n            target, _, start_marker, _ = hyprland_shortcut_target()\n            installed = False\n            if target.exists():\n                try:\n                    content = target.read_text(encoding="utf-8")\n                    installed = (\n                        start_marker in content\n                        or HYPR_MARKER_START_CONF in content\n                        or HYPR_MARKER_START_LUA in content\n                    )\n                except OSError:\n                    pass\n            checks[f"Meta+Z Hyprland binding ({target.name})"] = installed\n\n    for name, ok in checks.items():\n        if name in ("direct-typing", "direct-typing (SendInput)") and driver:\n            suffix = f" ({driver})"\n        elif name == "microphone":\n            suffix = f" ({microphone_label(config)})"\n        else:\n            suffix = ""\n        status_mark = "[OK]" if ok else "[FAIL]"\n        print(f"{status_mark} {name}{suffix}")\n\n    print(f"i desktop/os: {desktop}")\n    if driver_error:\n        print(f"i direct-typing: {driver_error}")\n    print(f"i model: {MODEL}")\n    if IS_WINDOWS:\n        print("i hotkey: win+z")\n\n    if not all(checks.values()):\n        raise SystemExit(1)\n'''
          core = core[:start] + doctor + core[end:]
          core_path.write_text(core, encoding="utf-8")

          tests_path = Path("tests/test_hardening.py")
          tests = tests_path.read_text(encoding="utf-8")
          anchor = '''    def test_linux_fatal_error_notification_is_best_effort(self) -> None:\n'''
          test = '''    def test_hyprland_doctor_fails_when_binding_is_missing(self) -> None:\n        config_file = Path(self.temp_dir.name) / "configured.json"\n        config_file.write_text("{}", encoding="utf-8")\n        missing_binding = Path(self.temp_dir.name) / "bindings.lua"\n        with mock.patch.object(self.core, "IS_WINDOWS", False), \\\n             mock.patch.object(self.core, "CONFIG_FILE", config_file), \\\n             mock.patch.object(self.core, "desktop_kind", return_value="hyprland"), \\\n             mock.patch.object(self.core, "load_config", return_value={"api_key": "key"}), \\\n             mock.patch.object(self.core, "available_output_driver", return_value="wtype"), \\\n             mock.patch.object(self.core, "hyprland_shortcut_target", return_value=(missing_binding, "", "# >>> ai-dikte >>>", "# <<< ai-dikte <<<")), \\\n             mock.patch.dict(os.environ, {"WAYLAND_DISPLAY": "wayland-1"}), \\\n             mock.patch("shutil.which", return_value="/usr/bin/tool"):\n            report, ok = self.core.doctor_report()\n        self.assertFalse(ok)\n        self.assertIn("[FAIL] Meta+Z Hyprland binding", report)\n\n'''
          if anchor not in tests:
              raise SystemExit("Hardening test anchor missing")
          tests_path.write_text(tests.replace(anchor, test + anchor, 1), encoding="utf-8")

          pkg_path = Path("PKGBUILD")
          pkg = pkg_path.read_text(encoding="utf-8")
          source_match = re.search(r"source=\(\n(.*?)\n\)", pkg, re.S)
          sums_match = re.search(r"sha256sums=\(\n.*?\n\)", pkg, re.S)
          if not source_match or not sums_match:
              raise SystemExit("Could not parse PKGBUILD")
          names = re.findall(r"'([^']+)'", source_match.group(1))
          sums = [hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in names]
          new_sums = "sha256sums=(\n" + "\n".join(f"  '{digest}'" for digest in sums) + "\n)"
          pkg_path.write_text(pkg[:sums_match.start()] + new_sums + pkg[sums_match.end():], encoding="utf-8")
          PY

      - name: Verify cleanup
        shell: bash
        run: |
          python3 -m py_compile ai_dikte_core.py tests/test_hardening.py
          python3 - <<'PY'
          from pathlib import Path
          core = Path("ai_dikte_core.py").read_text()
          assert "import queue\n" not in core
          assert "code: int = 1" not in core
          assert "available_output_driver(_config" not in core
          main = core.split("def main() -> None:", 1)[1]
          assert main.count('command == "setup"') == 1
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "Berkay YETGİN"
          git config user.email "85676216+Yakrel@users.noreply.github.com"
          git add ai_dikte_core.py PKGBUILD tests/test_hardening.py
          git commit -m "refactor: finish runtime ownership cleanup"
          git push origin HEAD:fix/simplify-settings-and-transcripts
