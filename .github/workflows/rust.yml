name: Rust rewrite
on:
  pull_request:

  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev xvfb libgl1-mesa-dri
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.98.1 fmt --check
      - name: Lint
        run: cargo +1.98.1 clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo +1.98.1 test --locked
      - name: Render settings smoke test
        if: runner.os == 'Linux'
        env:
          EFRAME_SCREENSHOT_TO: settings.png
          XDG_CONFIG_HOME: ${{ runner.temp }}/ai-dikte-ui-test
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          cargo +1.98.1 build --locked --features eframe/__screenshot
          timeout 30s xvfb-run -a target/debug/ai-dikte setup
      - name: Build development executable
        run: cargo +1.98.1 build --locked --release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ai-dikte-rust-${{ matrix.os }}
          path: |
            rust/target/release/ai-dikte
            rust/target/release/ai-dikte.exe
            rust/settings.png
          if-no-files-found: error
          retention-days: 7
