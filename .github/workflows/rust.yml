name: Rust rewrite
on:
  pull_request:

  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +1.98.1 fmt --check
      - name: Lint
        run: cargo +1.98.1 clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo +1.98.1 test --locked
      - name: Build development executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cargo +1.98.1 build --locked --release --features windows-host
          else
            cargo +1.98.1 build --locked --release
          fi
      - name: Exercise actual terminal backend
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install pyte==0.8.2
          python3 ../tests/tui_smoke.py target/release/ai-dikte
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ai-dikte-rust-${{ matrix.os }}
          path: |
            rust/target/release/ai-dikte
            rust/target/release/ai-dikte.exe
            rust/target/release/ai-dikte-background.exe
          if-no-files-found: error
          retention-days: 7
