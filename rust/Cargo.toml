[package]
name = "ai-dikte"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
default-run = "ai-dikte"
license = "MIT"

# Keep this standalone crate independent of manifests staged by packagers.
[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
url = "2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.16"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_System_Console", "Win32_Media_Audio", "Win32_System_Registry"] }

[dev-dependencies]

[profile.release]
lto = false
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
